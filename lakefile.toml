name = "lisa-checker"
version = "0.1.0"
defaultTargets = ["lisa-checker", "Tests"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Lisa"

[[lean_lib]]
name = "Tests"
roots = [
  "Tests.Alignment",
  "Tests.StoredHash",
  "Tests.OrderInterfaces",
  "Tests.SubstitutionRule",
  "Tests.SubstitutionBinary",
  "Tests.SubstitutionChecker",
  "Tests.OLCongruence",
  "Tests.OLComparison",
  "Tests.OLNormalization",
  "Tests.OLExpression",
  "Tests.OLCached",
  "Tests.Checker",
  "Tests.CheckerIntegration",
  "Tests.Binary",
  "Tests.AlphaBetaEtaOrder",
  "Tests.LambdaCore",
  "Tests.NamedIntegration",
  "Tests.NamedDecision",
  "Tests.NormalizationBoundary",
  "Tests.Support.GhostBoundary",
  "Tests.OrthologicBoundary",
  "Tests.CheckerBoundary",
  "Tests.OrderSimulation",
  "Tests.SerializedCorpus",
  "Tests.LambdaFol",
  "Tests.PureFolEpsilon",
  "Lisa.AlphaBetaEtaNormalization.Internal.CoreTests",
  "Lisa.AlphaBetaEtaNormalization.Internal.Tests"
]

[[lean_exe]]
name = "lisa-checker"
root = "Main"
